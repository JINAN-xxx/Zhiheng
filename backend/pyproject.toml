[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiheng-fastapi-backend-cli"
version = "1.10.0"
description = "ZhiHeng FastAPI backend internal CLI entrypoint"
requires-python = ">=3.10"

[project.scripts]
zhiheng = "cli.main:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.setuptools.package-dir]
zhiheng = "src/zhiheng"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["cli*", "zhiheng*"]

[tool.setuptools.package-data]
zhiheng = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/zhiheng", "../tools/check_architecture.py", "../tools/check_core_wheel.py"]
