# Match the immutable original URI, including encoded route characters. $uri may
# have become /platform.html by the time the SPA's access record is formatted.
map $request_uri $safe_request_target {
    default $request_uri;
    ~*^(?<shared_request_prefix>[^?]*?(?:/|%2f)(?:(?:a|%61)(?:p|%70)(?:i|%69)(?:/|%2f)(?:s|%73)(?:h|%68)(?:a|%61)(?:r|%72)(?:e|%65)(?:d|%64)(?:/|%2f)(?:m|%6d)(?:e|%65)(?:s|%73)(?:s|%73)(?:a|%61)(?:g|%67)(?:e|%65)(?:s|%73)|(?:s|%73)(?:h|%68)(?:a|%61)(?:r|%72)(?:e|%65))(?:/|%2f)) $shared_request_prefix[REDACTED];
}

map $http_referer $safe_http_referer {
    default $http_referer;
    ~*^[^?]*?(?:/|%2f)(?:(?:a|%61)(?:p|%70)(?:i|%69)(?:/|%2f)(?:s|%73)(?:h|%68)(?:a|%61)(?:r|%72)(?:e|%65)(?:d|%64)(?:/|%2f)(?:m|%6d)(?:e|%65)(?:s|%73)(?:s|%73)(?:a|%61)(?:g|%67)(?:e|%65)(?:s|%73)|(?:s|%73)(?:h|%68)(?:a|%61)(?:r|%72)(?:e|%65))(?:/|%2f) [REDACTED];
}

map $safe_http_referer $has_share_referer {
    default 0;
    [REDACTED] 1;
}

log_format share_safe escape=json '$remote_addr - $remote_user [$time_local] '
    '"$request_method $safe_request_target $server_protocol" $status $body_bytes_sent '
    '"$safe_http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index platform.html;
    client_max_body_size 32m;
    access_log /var/log/nginx/access.log share_safe;

    # Nginx error records cannot be formatted or filtered. Isolate requests with
    # bearer URLs in their target or Referer; normal traffic retains error logs.
    error_page 418 = @share_referer_proxy;
    error_page 419 = @share_referer_static;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api http://api:19090;

    location ~ ^/health/(live|ready)$ {
        if ($has_share_referer) { return 418; }
        proxy_pass $core_api;
        proxy_set_header Host $http_host;
        proxy_set_header Referer $safe_http_referer;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location ^~ /api/shared/messages/ {
        error_log /dev/null crit;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Referer $safe_http_referer;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        gzip off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Accel-Buffering no always;
    }

    location ~ ^/(api|v1|docs|redoc|openapi)(/|$)|^/openapi\.json$ {
        if ($has_share_referer) { return 418; }
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Referer $safe_http_referer;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    location = /api {
        return 404;
    }

    location = /v1 {
        return 404;
    }

    location = /platform.html {
        if ($has_share_referer) { return 419; }
        add_header Cache-Control "no-cache";
    }

    location ^~ /share/ {
        error_log /dev/null crit;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /platform.html =404;
    }

    location @share_referer_proxy {
        error_log /dev/null crit;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Referer $safe_http_referer;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    location @share_referer_static {
        error_log /dev/null crit;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /platform.html =404;
    }

    location / {
        if ($has_share_referer) { return 419; }
        try_files $uri $uri/ /platform.html;
    }
}
