name: zhiheng-core

x-core-environment: &core-environment
  ZHIHENG_DATABASE_URL: postgresql+asyncpg://${CORE_DB_USER:-zhiheng_core}:${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in the new core env file}@postgres:5432/${CORE_DB_NAME:-zhiheng_core}
  ZHIHENG_GRAPH_DATABASE_URL: ${CORE_GRAPH_DATABASE_URL:-}
  ZHIHENG_REDIS_URL: redis://redis:6379/0
  ZHIHENG_CREDENTIAL_KEY: ${CORE_CREDENTIAL_KEY:?Set a new Fernet CORE_CREDENTIAL_KEY}
  ZHIHENG_COOKIE_SECURE: ${CORE_COOKIE_SECURE:-true}
  ZHIHENG_ALLOWED_ORIGINS: ${CORE_ALLOWED_ORIGINS:-[]}
  ZHIHENG_KNOWLEDGE_RERANK_BATCH_TOKENS: ${CORE_KNOWLEDGE_RERANK_BATCH_TOKENS:-48000}
  ZHIHENG_PROVIDER_TIMEOUT_SECONDS: ${CORE_PROVIDER_TIMEOUT_SECONDS:-60}
  ZHIHENG_CHAT_SUMMARY_TRIGGER_TOKENS: ${CORE_CHAT_SUMMARY_TRIGGER_TOKENS:-auto}
  ZHIHENG_CHAT_SUMMARY_KEEP_TOKENS: ${CORE_CHAT_SUMMARY_KEEP_TOKENS:-auto}
  ZHIHENG_CHAT_SUMMARY_INPUT_TOKENS: ${CORE_CHAT_SUMMARY_INPUT_TOKENS:-auto}
  ZHIHENG_CHAT_SUMMARY_OUTPUT_TOKENS: ${CORE_CHAT_SUMMARY_OUTPUT_TOKENS:-auto}
  ZHIHENG_FILES_S3_ENDPOINT: ${CORE_FILES_S3_ENDPOINT:-http://file-objects:9000}
  ZHIHENG_FILES_S3_BUCKET: ${CORE_FILES_BUCKET:-zhiheng-files}
  ZHIHENG_FILES_S3_ACCESS_KEY: ${CORE_FILES_ACCESS_KEY:?Run ./deploy.sh init-minio for a dedicated business application account}
  ZHIHENG_FILES_S3_SECRET_KEY: ${CORE_FILES_SECRET_KEY:?Run ./deploy.sh init-minio for a dedicated business application account}
  ZHIHENG_FILES_S3_REGION: ${CORE_FILES_S3_REGION:-us-east-1}
  ZHIHENG_FILES_S3_TIMEOUT_SECONDS: ${CORE_FILES_S3_TIMEOUT_SECONDS:-30}
  ZHIHENG_MILVUS_URI: http://milvus:19530
  ZHIHENG_MILVUS_TOKEN: ${CORE_MILVUS_TOKEN:-}
  ZHIHENG_MILVUS_DATABASE: ${CORE_MILVUS_DATABASE:-default}
  ZHIHENG_WORKER_QUEUE: ${CORE_WORKER_QUEUE:-zhiheng:core:queue}
  ZHIHENG_SANDBOX_URL: ${CORE_SANDBOX_URL:-}
  ZHIHENG_BOCHA_API_KEY: ${CORE_BOCHA_API_KEY:-}
  ZHIHENG_WEB_SEARCH_TIMEOUT_SECONDS: ${CORE_WEB_SEARCH_TIMEOUT_SECONDS:-15}
  ZHIHENG_SANDBOX_API_KEY: ${CORE_SANDBOX_API_KEY:-}
  ZHIHENG_SANDBOX_IMAGE: ${CORE_SANDBOX_RUNTIME_REFERENCE:-${CORE_SANDBOX_RUNTIME_IMAGE:-zhiheng-workspace-runtime:0.2.0}}
  ZHIHENG_SANDBOX_CPU: ${CORE_SANDBOX_CPU:-1}
  ZHIHENG_SANDBOX_MEMORY_MB: ${CORE_SANDBOX_MEMORY_MB:-1024}
  ZHIHENG_SANDBOX_RUN_SECONDS: ${CORE_SANDBOX_RUN_SECONDS:-600}
  ZHIHENG_SANDBOX_READY_SECONDS: ${CORE_SANDBOX_READY_SECONDS:-60}
  ZHIHENG_SANDBOX_PIP_INDEX_URL: ${CORE_SANDBOX_PIP_INDEX_URL:-https://pypi.org/simple}

x-core-backend: &core-backend
  image: ${CORE_BACKEND_IMAGE:-zhiheng-core-api:0.1.0}
  build:
    context: ../../backend
    dockerfile: Dockerfile.core
    args:
      PYTHON_IMAGE: ${CORE_PYTHON_IMAGE:-python:3.12-slim}
      PIP_INDEX_URL: ${CORE_PIP_INDEX_URL:-https://pypi.org/simple}
  environment: *core-environment
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  init: true
  stop_grace_period: 90s

services:
  sandbox-runtime:
    profiles: [workspace]
    image: ${CORE_SANDBOX_RUNTIME_IMAGE:-zhiheng-workspace-runtime:0.2.0}
    build:
      context: ../sandbox/runtime
      args:
        PYTHON_IMAGE: ${CORE_SANDBOX_PYTHON_IMAGE:-python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b}
        PIP_INDEX_URL: ${CORE_PIP_INDEX_URL:-https://pypi.org/simple}
        APT_MIRROR: ${CORE_SANDBOX_APT_MIRROR:-https://deb.debian.org}
    entrypoint: [/bin/true]
    restart: 'no'

  sandbox-manager:
    profiles: [workspace]
    image: ${CORE_SANDBOX_MANAGER_IMAGE:-zhiheng-sandbox-manager:1.2.1}
    build:
      context: ../sandbox/manager
      args:
        PYTHON_IMAGE: ${CORE_SANDBOX_PYTHON_IMAGE:-python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b}
        PIP_INDEX_URL: ${CORE_PIP_INDEX_URL:-https://pypi.org/simple}
    network_mode: host
    environment:
      OPENSANDBOX_SERVER_API_KEY: ${CORE_SANDBOX_API_KEY:-}
      ZHIHENG_SANDBOX_MANAGER_PORT: ${CORE_SANDBOX_MANAGER_PORT:-19192}
      ZHIHENG_SANDBOX_EXECD_IMAGE: ${CORE_SANDBOX_EXECD_IMAGE:-opensandbox/execd:release-1.2.1}
      ZHIHENG_SANDBOX_EGRESS_IMAGE: ${CORE_SANDBOX_EGRESS_IMAGE:-opensandbox/egress:release-1.2.1}
      ZHIHENG_SANDBOX_WORKSPACE_MB: ${CORE_SANDBOX_WORKSPACE_MB:-1024}
      ZHIHENG_SANDBOX_DNS_SERVERS: ${CORE_SANDBOX_DNS_SERVERS:-223.5.5.5,1.1.1.1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-manager-data:/root/.opensandbox
    depends_on:
      sandbox-runtime:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, /opt/healthcheck.py]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 12
    mem_limit: 768m
    restart: unless-stopped

  vector-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    stop_grace_period: 30s
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command: [etcd, -advertise-client-urls=http://vector-etcd:2379, -listen-client-urls, 'http://0.0.0.0:2379', --data-dir, /etcd]
    volumes:
      - vector-etcd-data:/etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  vector-objects:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    stop_grace_period: 30s
    environment:
      MINIO_ROOT_USER: ${CORE_VECTOR_ACCESS_KEY:?Create independent CORE_VECTOR_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CORE_VECTOR_SECRET_KEY:?Create independent CORE_VECTOR_SECRET_KEY}
    command: [minio, server, /minio_data, --console-address, ':9001']
    volumes:
      - vector-objects-data:/minio_data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  file-objects:
    image: ${CORE_FILES_MINIO_IMAGE:-milvusdb/minio:RELEASE.2024-12-18T13-15-44Z}
    stop_grace_period: 30s
    environment:
      MINIO_ROOT_USER: ${CORE_FILES_ROOT_USER:?Run ./deploy.sh init-minio for independent business storage credentials}
      MINIO_ROOT_PASSWORD: ${CORE_FILES_ROOT_PASSWORD:?Run ./deploy.sh init-minio for independent business storage credentials}
      MINIO_SITE_REGION: ${CORE_FILES_S3_REGION:-us-east-1}
    command: [minio, server, /data, --console-address, ':9001']
    volumes:
      - file-objects-data:/data
    ports:
      - '${CORE_FILES_CONSOLE_BIND:-127.0.0.1}:${CORE_FILES_CONSOLE_PORT:-19001}:9001'
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  file-objects-init:
    image: ${CORE_FILES_MINIO_IMAGE:-milvusdb/minio:RELEASE.2024-12-18T13-15-44Z}
    entrypoint: [sh, /bootstrap/init-file-objects.sh]
    environment:
      MINIO_ROOT_USER: ${CORE_FILES_ROOT_USER:?Run ./deploy.sh init-minio}
      MINIO_ROOT_PASSWORD: ${CORE_FILES_ROOT_PASSWORD:?Run ./deploy.sh init-minio}
      MINIO_APP_ACCESS_KEY: ${CORE_FILES_ACCESS_KEY:?Run ./deploy.sh init-minio}
      MINIO_APP_SECRET_KEY: ${CORE_FILES_SECRET_KEY:?Run ./deploy.sh init-minio}
      MINIO_BUCKET: ${CORE_FILES_BUCKET:-zhiheng-files}
      MINIO_REGION: ${CORE_FILES_S3_REGION:-us-east-1}
    volumes:
      - ./init-file-objects.sh:/bootstrap/init-file-objects.sh:ro
    depends_on:
      file-objects:
        condition: service_healthy
    restart: 'no'

  milvus:
    image: milvusdb/milvus:v2.6.25
    stop_grace_period: 60s
    command: [milvus, run, standalone]
    security_opt: [seccomp:unconfined]
    environment:
      ETCD_ENDPOINTS: vector-etcd:2379
      MINIO_ADDRESS: vector-objects:9000
      MINIO_ACCESS_KEY_ID: ${CORE_VECTOR_ACCESS_KEY:?Create independent CORE_VECTOR_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${CORE_VECTOR_SECRET_KEY:?Create independent CORE_VECTOR_SECRET_KEY}
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      vector-etcd:
        condition: service_healthy
      vector-objects:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 36
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:-zhiheng_core}
      POSTGRES_USER: ${CORE_DB_USER:-zhiheng_core}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in the new core env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrator:
    <<: *core-backend
    command: [python, -m, zhiheng, migrate]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'

  worker:
    <<: *core-backend
    command: [python, -m, zhiheng, worker]
    depends_on:
      file-objects-init:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,time; from redis import Redis;
          client=Redis.from_url(os.environ['ZHIHENG_REDIS_URL']);
          heartbeat=client.get(os.environ['ZHIHENG_WORKER_QUEUE']+':heartbeat');
          client.close();
          raise SystemExit(0 if heartbeat is not None and 0 <= time.time()-float(heartbeat) <= 15 else 1)
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  api:
    <<: *core-backend
    command: [python, -m, zhiheng, serve, --host, 0.0.0.0, --port, '19090']
    depends_on:
      file-objects-init:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:19090/health/ready', timeout=2).close()"
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  web:
    image: ${CORE_FRONTEND_IMAGE:-zhiheng-core-web:0.1.0}
    build:
      context: ../../frontend
      dockerfile: Dockerfile.core
      args:
        NODE_IMAGE: ${CORE_NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${CORE_NGINX_IMAGE:-nginx:1.28-alpine}
    ports:
      - '${CORE_WEB_BIND:-127.0.0.1}:${CORE_WEB_PORT:-19080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/platform.html]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  sandbox-manager-data:
  vector-etcd-data:
  vector-objects-data:
  file-objects-data:
  milvus-data:
  postgres-data:
  redis-data:
