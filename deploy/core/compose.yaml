name: zhiheng-core

x-core-environment: &core-environment
  ZHIHENG_DATABASE_URL: postgresql+asyncpg://${CORE_DB_USER:-zhiheng_core}:${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in the new core env file}@postgres:5432/${CORE_DB_NAME:-zhiheng_core}
  ZHIHENG_REDIS_URL: redis://redis:6379/0
  ZHIHENG_CREDENTIAL_KEY: ${CORE_CREDENTIAL_KEY:?Set a new Fernet CORE_CREDENTIAL_KEY}
  ZHIHENG_COOKIE_SECURE: ${CORE_COOKIE_SECURE:-true}
  ZHIHENG_ALLOWED_ORIGINS: ${CORE_ALLOWED_ORIGINS:-[]}
  ZHIHENG_TOKEN_LIMIT: ${CORE_TOKEN_LIMIT:-100000}
  ZHIHENG_PROVIDER_TIMEOUT_SECONDS: ${CORE_PROVIDER_TIMEOUT_SECONDS:-60}
  ZHIHENG_WORKER_QUEUE: ${CORE_WORKER_QUEUE:-zhiheng:core:queue}

x-core-backend: &core-backend
  image: ${CORE_BACKEND_IMAGE:-zhiheng-core-api:0.1.0}
  build:
    context: ../../backend
    dockerfile: Dockerfile.core
    args:
      PYTHON_IMAGE: ${CORE_PYTHON_IMAGE:-python:3.12-slim}
      PIP_INDEX_URL: ${CORE_PIP_INDEX_URL:-https://pypi.org/simple}
  environment: *core-environment
  init: true
  stop_grace_period: 90s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:-zhiheng_core}
      POSTGRES_USER: ${CORE_DB_USER:-zhiheng_core}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in the new core env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrator:
    <<: *core-backend
    command: [python, -m, zhiheng, migrate]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'

  worker:
    <<: *core-backend
    command: [python, -m, zhiheng, worker]
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,time; from redis import Redis;
          client=Redis.from_url(os.environ['ZHIHENG_REDIS_URL']);
          heartbeat=client.get(os.environ['ZHIHENG_WORKER_QUEUE']+':heartbeat');
          client.close();
          raise SystemExit(0 if heartbeat is not None and 0 <= time.time()-float(heartbeat) <= 15 else 1)
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  api:
    <<: *core-backend
    command: [python, -m, zhiheng, serve, --host, 0.0.0.0, --port, '19090']
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:19090/health/ready', timeout=2).close()"
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  web:
    image: ${CORE_FRONTEND_IMAGE:-zhiheng-core-web:0.1.0}
    build:
      context: ../../frontend
      dockerfile: Dockerfile.core
      args:
        NODE_IMAGE: ${CORE_NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${CORE_NGINX_IMAGE:-nginx:1.28-alpine}
    ports:
      - '${CORE_WEB_BIND:-127.0.0.1}:${CORE_WEB_PORT:-19080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/platform.html]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
