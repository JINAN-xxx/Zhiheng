manifestVersion: 1
id: ai
name: AI 管理
version: 0.4.0
description: AI 模型管理与智能对话插件。

metadata:
  category: ai
  tags:
    - ai
    - chat
  author: insistence
  license: MIT

backend:
  module: plugins.ai
  hooks:
    onStartup: plugins.ai.hooks:on_startup
    onShutdown: plugins.ai.hooks:on_shutdown
  routers:
    autoScan: true
  migrations:
    - migrations/mysql/001_init.sql
    - migrations/mysql/002_model_service_foundation.sql
    - migrations/mysql/003_platform_chat.sql
    - migrations/postgresql/001_init.sql
    - migrations/postgresql/002_model_service_foundation.sql
    - migrations/postgresql/003_platform_chat.sql
  seeds:
    - seeds/mysql/ai_provider_type.sql
    - seeds/postgresql/ai_provider_type.sql
  jobs: []

frontend:
  basePath: ai
  pluginId: ai
  viewsPath: views
  apiPath: api
  delivery:
    type: source
    buildRequired: true
  menus:
    - name: AI 管理
      path: ai
      component: Layout
      perms: ''
      type: M
      orderNum: 4
      icon: ai-manage
      children:
        - name: 模型中心
          path: model
          component: plugin/ai/model/index
          routeName: AiModel
          perms: ai:model:list
          type: C
          orderNum: 1
          icon: ai-model
        - name: AI 对话
          path: chat
          component: plugin/ai/chat/index
          routeName: AiChat
          perms: ai:chat:list
          type: C
          orderNum: 2
          icon: ai-chat

permissions:
  - code: ai:model:list
    name: 模型列表
  - code: ai:model:add
    name: 新增模型
  - code: ai:model:edit
    name: 修改模型
  - code: ai:model:remove
    name: 删除模型
  - code: ai:model:query
    name: 查询模型
  - code: ai:chat:list
    name: AI 对话
  - code: ai:runtime:query
    name: Runtime 诊断
  - code: ai:model:publish
    name: 发布模型
  - code: ai:model:test
    name: 测试模型连接
  - code: ai:engine:credential:list
    name: 查询引擎凭据
  - code: ai:engine:credential:add
    name: 新增引擎凭据
  - code: ai:engine:credential:rotate
    name: 轮换引擎凭据
  - code: ai:engine:credential:remove
    name: 删除引擎凭据
  - code: ai:engine:deployment:list
    name: 引擎部署列表
  - code: ai:engine:deployment:query
    name: 查询引擎部署
  - code: ai:engine:deployment:add
    name: 新增引擎部署
  - code: ai:engine:deployment:edit
    name: 修改引擎部署
  - code: ai:engine:deployment:remove
    name: 删除引擎部署

dependencies:
  python:
    - httpx==0.28.1
    - litellm==1.94.0
  npm:
    - '@antv/infographic^0.2.13'
    - '@terrastruct/d2>=0.1.33'
    - katex>=0.16.27
    - markstream-vue>=1.0.9-beta.2
    - mermaid>=11.15.0
    - shiki^3.21.0
    - stream-diffs>=0.0.2
    - stream-markdown>=0.0.16
    - stream-monaco>=0.0.48
  npmDev:
    - vite-plugin-monaco-editor-esm==2.0.2
  plugins: []

compatibility:
  databases:
    - mysql
    - postgresql
