services:
  # 前端服务
  zhiheng-frontend:
    build:
      context: ../zhiheng-fastapi-frontend
      dockerfile: Dockerfile
    image: zhiheng-frontend:latest
    container_name: zhiheng-frontend-test
    ports:
      - "80:80"
    volumes:
      - ../zhiheng-fastapi-frontend/bin/nginx.dockerpg.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - zhiheng-backend-pg
    networks:
      - zhiheng-network-test

  # 后端服务（PostgreSQL版本）
  zhiheng-backend-pg:
    build:
      context: ../zhiheng-fastapi-backend
      dockerfile: Dockerfile.pg
    image: zhiheng-backend-pg:latest
    container_name: zhiheng-backend-pg-test
    ports:
      - "9099:9099"
    environment:
      TRANSPORT_CRYPTO_ENABLED: "false"
      TRANSPORT_CRYPTO_MODE: "off"
    depends_on:
      zhiheng-pg:
        condition: service_healthy
      zhiheng-redis:
        condition: service_healthy
    networks:
      - zhiheng-network-test

  # PostgreSQL服务
  zhiheng-pg:
    image: postgres:14
    container_name: zhiheng-pg-test
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: zhiheng-fastapi
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "15433:5432"
    volumes:
      - ../zhiheng-fastapi-backend/sql/zhiheng-fastapi-pg.sql:/docker-entrypoint-initdb.d/01-zhiheng-fastapi-pg.sql
      - ./disable_captcha.sql:/docker-entrypoint-initdb.d/02-disable-captcha.sql
    networks:
      - zhiheng-network-test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  zhiheng-redis:
    image: redis:latest
    container_name: zhiheng-redis-test
    ports:
      - "16381:6379"
    networks:
      - zhiheng-network-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  zhiheng-network-test:
    name: zhiheng-network-test
    driver: bridge