name: Ruff Check

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.4

      - name: Run linting
        run: ruff check zhiheng-fastapi-backend deploy/release deploy/release_cli.py

      - name: Run format check
        run: ruff format zhiheng-fastapi-backend deploy/release deploy/release_cli.py --check
