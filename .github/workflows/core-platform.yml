name: AI Core Platform

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master, 'release/**']

permissions:
  contents: read

concurrency:
  group: core-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: core-ci-test-only
          POSTGRES_DB: core_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core_tests"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ZHIHENG_TEST_DATABASE_URL: postgresql+asyncpg://postgres:core-ci-test-only@127.0.0.1:5432/core_tests
      ZHIHENG_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      PLATFORM_BROWSER_URL: http://127.0.0.1:15191
      PLATFORM_API_TARGET: http://127.0.0.1:19090
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-core.lock
            backend/requirements-dev-core.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked backend and browser tools
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-core.lock
          python -m pip install -r requirements-dev-core.txt playwright==1.62.0
          python -m pip install --no-deps --no-build-isolation .
          python -m playwright install --with-deps chromium
      - name: Start independent vector and file services for integration tests
        run: |
          ./deploy.sh --env-file "$RUNNER_TEMP/core-vector.env" init
          cat > "$RUNNER_TEMP/core-vector-ports.yml" <<'YAML'
          services:
            milvus:
              ports:
                - '127.0.0.1::19530'
            file-objects:
              ports:
                - '127.0.0.1::9000'
                - '127.0.0.1::9001'
          YAML
          docker compose --env-file "$RUNNER_TEMP/core-vector.env" -f deploy/core/compose.yaml -f "$RUNNER_TEMP/core-vector-ports.yml" -p zhiheng-ci-vectors up --detach --wait milvus file-objects
          docker compose --env-file "$RUNNER_TEMP/core-vector.env" -f deploy/core/compose.yaml -f "$RUNNER_TEMP/core-vector-ports.yml" -p zhiheng-ci-vectors run --rm file-objects-init
          vector_address="$(docker compose --env-file "$RUNNER_TEMP/core-vector.env" -f deploy/core/compose.yaml -f "$RUNNER_TEMP/core-vector-ports.yml" -p zhiheng-ci-vectors port milvus 19530)"
          echo "ZHIHENG_TEST_MILVUS_URI=http://$vector_address" >> "$GITHUB_ENV"
          objects_address="$(docker compose --env-file "$RUNNER_TEMP/core-vector.env" -f deploy/core/compose.yaml -f "$RUNNER_TEMP/core-vector-ports.yml" -p zhiheng-ci-vectors port file-objects 9000)"
          echo "ZHIHENG_TEST_S3_ENDPOINT=http://$objects_address" >> "$GITHUB_ENV"
          python - "$RUNNER_TEMP/core-vector.env" "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          import sys
          values = dict(line.split('=', 1) for line in Path(sys.argv[1]).read_text().splitlines() if '=' in line and not line.startswith('#'))
          with Path(sys.argv[2]).open('a') as stream:
              stream.write('ZHIHENG_TEST_S3_ACCESS_KEY=' + values['CORE_FILES_ROOT_USER'] + '\n')
              stream.write('ZHIHENG_TEST_S3_SECRET_KEY=' + values['CORE_FILES_ROOT_PASSWORD'] + '\n')
          PY
      - name: Run PostgreSQL, Redis and local model integration tests
        run: bash tools/verify-core.sh backend-integration
      - name: Install frontend with npm 11
        working-directory: frontend
        run: |
          npm install --global npm@11.9.0
          npm ci
      - name: Check and build the frontend
        run: bash tools/verify-core.sh frontend
      - name: Start the built platform preview
        working-directory: frontend
        run: |
          node node_modules/vite/bin/vite.js preview --config vite.platform.config.ts --host 127.0.0.1 --port 15191 --strictPort > "$RUNNER_TEMP/core-preview.log" 2>&1 &
          preview_pid=$!
          echo "$preview_pid" > "$RUNNER_TEMP/core-preview.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:15191/platform.html > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/core-preview.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/core-preview.log"
          exit 1
      - name: Exercise the installed platform in Chromium
        working-directory: backend
        run: |
          ZHIHENG_E2E_PYTHON="$(command -v python)" python tests/core/e2e/browser_check.py \
            --base-url http://127.0.0.1:15191 --api-port 19090 \
            --artifacts-dir "$RUNNER_TEMP/core-e2e"
      - name: Stop the real API preview before fixture regressions
        run: |
          preview_pid="$(cat "$RUNNER_TEMP/core-preview.pid")"
          kill "$preview_pid"
          for attempt in {1..30}; do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              rm "$RUNNER_TEMP/core-preview.pid"
              exit 0
            fi
            sleep 0.1
          done
          echo "The real API preview did not stop" >&2
          exit 1
      - name: Export public schema fixtures without starting application services
        run: |
          python tools/export_openapi.py --output "$RUNNER_TEMP/core-schema-fixtures"
          echo "PLATFORM_SCHEMA_FIXTURES=$RUNNER_TEMP/core-schema-fixtures" >> "$GITHUB_ENV"
      - name: Start built and source fixture hosts
        working-directory: frontend
        run: |
          node node_modules/vite/bin/vite.js preview --config tests/browser/vite.config.ts --host 127.0.0.1 --port 15191 --strictPort > "$RUNNER_TEMP/core-built-fixture.log" 2>&1 &
          built_pid=$!
          echo "$built_pid" > "$RUNNER_TEMP/core-built-fixture.pid"
          node node_modules/vite/bin/vite.js --config tests/browser/vite.config.ts --host 127.0.0.1 --port 15192 --strictPort > "$RUNNER_TEMP/core-source-fixture.log" 2>&1 &
          source_pid=$!
          echo "$source_pid" > "$RUNNER_TEMP/core-source-fixture.pid"
          for port in 15191 15192; do
            ready=false
            for attempt in {1..30}; do
              if ! kill -0 "$built_pid" 2>/dev/null || ! kill -0 "$source_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/core-built-fixture.log" "$RUNNER_TEMP/core-source-fixture.log"
                exit 1
              fi
              if curl --fail --silent "http://127.0.0.1:$port/platform.html" > /dev/null && \
                 curl --fail --silent "http://127.0.0.1:$port/openapi/resources-v1.json" > /dev/null && \
                 curl --fail --silent "http://127.0.0.1:$port/openapi/inference-v1.json" > /dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then
              cat "$RUNNER_TEMP/core-built-fixture.log" "$RUNNER_TEMP/core-source-fixture.log"
              exit 1
            fi
            for path in api v1; do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/$path")"
              if [[ "$status" != 404 ]]; then
                echo "Fixture host $port unexpectedly serves /$path with HTTP $status" >&2
                exit 1
              fi
            done
          done
      - name: Check every declared HTTP and SSE browser regression
        run: |
          bash tools/verify-core.sh browser \
            --base-url http://127.0.0.1:15191 --source-url http://127.0.0.1:15192 \
            --output "$RUNNER_TEMP/core-browser-results" --workers 1
      - name: Stop preview and fixture hosts
        if: always()
        run: |
          for name in core-preview core-built-fixture core-source-fixture; do
            if [[ -f "$RUNNER_TEMP/$name.pid" ]]; then
              preview_pid="$(cat "$RUNNER_TEMP/$name.pid")"
              if kill -0 "$preview_pid" 2>/dev/null; then
                kill "$preview_pid"
              fi
            fi
          done
      - name: Remove the independent CI vector service
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/core-vector.env" && -f "$RUNNER_TEMP/core-vector-ports.yml" ]]; then
            docker compose --env-file "$RUNNER_TEMP/core-vector.env" -f deploy/core/compose.yaml -f "$RUNNER_TEMP/core-vector-ports.yml" -p zhiheng-ci-vectors down --volumes
          fi
      - name: Preserve browser and service diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-browser-diagnostics
          path: |
            ${{ runner.temp }}/core-preview.log
            ${{ runner.temp }}/core-built-fixture.log
            ${{ runner.temp }}/core-source-fixture.log
            ${{ runner.temp }}/core-browser-results
            ${{ runner.temp }}/core-e2e
            ${{ runner.temp }}/core-schema-fixtures
          if-no-files-found: ignore
