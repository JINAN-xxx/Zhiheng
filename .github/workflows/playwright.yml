name: Playwright Tests

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']

jobs:
  platform-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zhiheng-fastapi-frontend
    env:
      PLATFORM_SHELL_BASE_URL: http://127.0.0.1:15174
      PLATFORM_SHELL_SCREENSHOT_DIR: /tmp/platform-shell-screenshots

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend and browser dependencies
        run: |
          npm install --no-package-lock
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium

      - name: Run frontend plugin and contract tests
        run: npm run test:plugin

      - name: Test browser check helpers
        run: python -m unittest discover -s tests/e2e -p 'test_*.py' -v

      - name: Run platform browser checks with mocked APIs
        run: |
          npm run dev -- --host 127.0.0.1 --port 15174 --strictPort > /tmp/platform-shell-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' --fail --silent "$PLATFORM_SHELL_BASE_URL" > /dev/null; then
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat /tmp/platform-shell-vite.log
              exit 1
            fi
            sleep 1
          done
          curl --noproxy '*' --fail --silent "$PLATFORM_SHELL_BASE_URL" > /dev/null
          CHAT_WORK_CHECK_BASE_URL="$PLATFORM_SHELL_BASE_URL" python -u tests/e2e/chat_work_mode_check.py
          python -u tests/e2e/platform_shell_check.py
          python -u tests/e2e/model_vision_check.py

      - name: Upload browser screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-shell-browser-checks
          path: |
            /tmp/platform-shell-screenshots/
            /tmp/chat-work-acceptance/
            /tmp/platform-shell-vite.log
          if-no-files-found: ignore
