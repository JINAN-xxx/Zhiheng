name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pg-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.docker_cache
          key: ${{ runner.os }}-docker-${{ matrix.python-version }}-${{ hashFiles('**/Dockerfile*', '**/requirements.txt') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create temporary Dockerfile with Python ${{ matrix.python-version }}
        run: |
          cp zhiheng-fastapi-backend/Dockerfile.pg zhiheng-fastapi-backend/Dockerfile.pg.bak
          sed -e "s/FROM python:3.10/FROM python:${{ matrix.python-version }}/g" \
              -e 's| -i https://pypi.tuna.tsinghua.edu.cn/simple||g' \
              zhiheng-fastapi-backend/Dockerfile.pg.bak > zhiheng-fastapi-backend/Dockerfile.pg

      - name: Restore original Dockerfile.pg
        if: always()
        run: |
          mv zhiheng-fastapi-backend/Dockerfile.pg.bak zhiheng-fastapi-backend/Dockerfile.pg