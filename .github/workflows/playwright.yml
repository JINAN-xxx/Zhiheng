name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pg-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.docker_cache
          key: ${{ runner.os }}-docker-${{ matrix.python-version }}-${{ hashFiles('**/Dockerfile*', '**/requirements.txt') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create temporary Dockerfile with Python ${{ matrix.python-version }}
        run: |
          cp zhiheng-fastapi-backend/Dockerfile.pg zhiheng-fastapi-backend/Dockerfile.pg.bak
          sed -e "s/FROM python:3.10/FROM python:${{ matrix.python-version }}/g" \
              -e 's| -i https://pypi.tuna.tsinghua.edu.cn/simple||g' \
              zhiheng-fastapi-backend/Dockerfile.pg.bak > zhiheng-fastapi-backend/Dockerfile.pg

      - name: Start services with docker-compose
        run: |
          cd zhiheng-fastapi-test
          docker compose -f docker-compose.test.pg.yml up -d --build

      - name: Wait for services to be ready
        run: |
          cd zhiheng-fastapi-test
          timeout 180 bash -c 'until docker compose -f docker-compose.test.pg.yml ps zhiheng-backend-pg | grep -q "Up"; do sleep 5; done'
          timeout 120 bash -c 'until docker compose -f docker-compose.test.pg.yml ps zhiheng-frontend | grep -q "Up"; do sleep 5; done'
          sleep 30
          echo "Checking if backend service is ready..."
          for i in {1..30}; do
            if curl -f http://localhost:9099/captchaImage > /dev/null 2>&1; then
              echo "Backend service is ready!"
              break
            fi
            echo "Waiting for backend service to be ready... ($i/30)"
            sleep 5
          done
          if ! curl -f http://localhost:9099/captchaImage > /dev/null 2>&1; then
            echo "Backend service failed to start properly. Checking logs..."
            docker logs zhiheng-backend-pg-test
            exit 1
          fi

      - name: Run tests
        run: |
          cd zhiheng-fastapi-test
          pip install -r requirements.txt
          playwright install
          pytest -v

      - name: Stop services
        if: always()
        run: |
          cd zhiheng-fastapi-test
          docker compose -f docker-compose.test.pg.yml down

      - name: Restore original Dockerfile.pg
        if: always()
        run: |
          mv zhiheng-fastapi-backend/Dockerfile.pg.bak zhiheng-fastapi-backend/Dockerfile.pg