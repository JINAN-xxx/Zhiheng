name: Workspace Sandbox Release Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-sandbox-release
  cancel-in-progress: false

jobs:
  workspace-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: workspace-sandbox-acceptance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-core.lock
            backend/requirements-dev-core.txt
      - name: Install the locked backend and test tools
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-core.lock
          python -m pip install -r requirements-dev-core.txt
      - name: Require real sandbox and Office acceptance
        env:
          ZHIHENG_TEST_DATABASE_URL: ${{ secrets.ZHIHENG_TEST_DATABASE_URL }}
          ZHIHENG_TEST_REDIS_URL: ${{ secrets.ZHIHENG_TEST_REDIS_URL }}
          ZHIHENG_TEST_S3_ENDPOINT: ${{ secrets.ZHIHENG_TEST_S3_ENDPOINT }}
          ZHIHENG_TEST_S3_ACCESS_KEY: ${{ secrets.ZHIHENG_TEST_S3_ACCESS_KEY }}
          ZHIHENG_TEST_S3_SECRET_KEY: ${{ secrets.ZHIHENG_TEST_S3_SECRET_KEY }}
          ZHIHENG_TEST_SANDBOX_URL: ${{ secrets.ZHIHENG_TEST_SANDBOX_URL }}
          ZHIHENG_TEST_SANDBOX_API_KEY: ${{ secrets.ZHIHENG_TEST_SANDBOX_API_KEY }}
          ZHIHENG_TEST_SANDBOX_IMAGE: ${{ vars.ZHIHENG_TEST_SANDBOX_IMAGE }}
        run: bash tools/verify-core.sh workspace-sandbox
