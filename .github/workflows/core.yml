name: AI Core Foundation

on:
  push:
    branches: [master, 'release/**', 'refactor/**']
  pull_request:
    branches: [master, 'release/**', 'refactor/**']

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev-core.txt
      - name: Install core development tools
        run: python -m pip install -r requirements-dev-core.txt
      - name: Check new core rules and format
        run: |
          python -m ruff check --config ruff.toml src tests/unit ../tools/check_architecture.py ../tools/check_core_wheel.py
          python -m ruff format --check --config ruff.toml src tests/unit ../tools/check_architecture.py ../tools/check_core_wheel.py
      - name: Check core typing and dependency directions
        run: |
          python -m mypy --config-file pyproject.toml
          python ../tools/check_architecture.py src/zhiheng
      - name: Run isolated core tests
        run: python -m pytest tests/unit -q
      - name: Verify distributable core and existing CLI
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/zhiheng-core-wheel" .
          python ../tools/check_core_wheel.py "$RUNNER_TEMP/zhiheng-core-wheel"
