name: AI Core Foundation

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master, 'release/**']

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-core.lock
            backend/requirements-dev-core.txt
      - name: Install hashed core dependencies and development tools
        run: |
          python -m pip install --require-hashes -r requirements-core.lock
          python -m pip install -r requirements-dev-core.txt
      - name: Check the backend foundation
        run: bash ../tools/verify-core.sh foundation
      - name: Verify platform wheel and independent CLI
        run: |
          bash ../tools/verify-core.sh wheel "$RUNNER_TEMP/zhiheng-core-wheel"
          python -m pip install --no-deps "$RUNNER_TEMP/zhiheng-core-wheel"/zhiheng_platform-*.whl
          python -m zhiheng --help
          zhiheng --help
