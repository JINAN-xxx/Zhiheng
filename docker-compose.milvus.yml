# 旧拆分部署兼容配置；新部署使用根 compose.yaml 和 ./deploy.sh init。
services:
  milvus:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/milvusdb/milvus:v2.6.9
    pull_policy: never
    container_name: ruoyi-milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - seccomp:unconfined
    mem_limit: 4g
    cpus: 2.0
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      ETCD_ENDPOINTS: 127.0.0.1:2379
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - ${MILVUS_DATA_DIR:-./data/milvus}:/var/lib/milvus
      - ./deploy/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./deploy/milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:19591:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    networks:
      - ruoyi-network

networks:
  ruoyi-network:
    external: true
