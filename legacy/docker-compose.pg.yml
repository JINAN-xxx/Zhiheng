# 旧拆分部署兼容配置；新部署使用根 compose.yaml 和 ./deploy.sh init。
services:
  # 前端服务
  zhiheng-frontend:
    image: nginx:latest
    container_name: zhiheng-frontend
    restart: unless-stopped
    ports:
      - "12580:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/bin/nginx.dockerpg.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      zhiheng-backend-pg:
        condition: service_healthy
    networks:
      - zhiheng-network

  # 后端服务（PostgreSQL版本）
  zhiheng-backend-pg:
    build:
      context: ./backend
      dockerfile: Dockerfile.pg
    image: zhiheng-backend-pg:latest
    container_name: zhiheng-backend-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:19099:9099"
    volumes:
      - ./frontend:/frontend:ro
      - ./data/agent-skills:/app/data/agent-skills
      - ./data/platform-files:/app/vf_admin
    environment:
      APP_DEFAULT_ENABLED_PLUGINS: ai,agent_extension
      AGENT_SKILL_DATA_DIR: /app/data/agent-skills
      DB_HOST: litellm-db
      DB_PORT: "5432"
      DB_USERNAME: ${PLATFORM_DB_USER:-zhiheng}
      DB_PASSWORD: "${ZHIHENG_DB_PASSWORD:?run deploy/zhiheng/init-shared-postgres.sh first}"
      DB_DATABASE: ${PLATFORM_DB_NAME:-zhiheng-fastapi}
      REDIS_PASSWORD: "${ZHIHENG_REDIS_PASSWORD:?run deploy/zhiheng/init-shared-postgres.sh first}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?run deploy/zhiheng/init-shared-postgres.sh first}"
      LITELLM_BASE_URL: http://litellm-proxy:4000
      LITELLM_RUNTIME_KEY: "${LITELLM_RUNTIME_KEY:?set LITELLM_RUNTIME_KEY in repository .env}"
      LITELLM_MANAGEMENT_KEY: "${LITELLM_MANAGEMENT_KEY:?set LITELLM_MANAGEMENT_KEY in repository .env}"
      APP_DISABLE_SWAGGER: "false"
      APP_DISABLE_REDOC: "false"
      AI_PUBLIC_API_ENABLED: "${AI_PUBLIC_API_ENABLED:?set AI_PUBLIC_API_ENABLED in repository .env}"
      AI_API_KEY_PEPPER_CURRENT_VERSION: "${AI_API_KEY_PEPPER_CURRENT_VERSION:?set AI_API_KEY_PEPPER_CURRENT_VERSION in repository .env}"
      AI_API_KEY_PEPPER_V1: "${AI_API_KEY_PEPPER_V1:?set AI_API_KEY_PEPPER_V1 in repository .env}"
    depends_on:
      zhiheng-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9099/docs', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - zhiheng-network
      - litellm-network

  # Redis服务
  zhiheng-redis:
    image: redis:latest
    container_name: zhiheng-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    environment:
      ZHIHENG_REDIS_PASSWORD: "${ZHIHENG_REDIS_PASSWORD:?run deploy/zhiheng/init-shared-postgres.sh first}"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${ZHIHENG_REDIS_PASSWORD}\""]
    networks:
      - zhiheng-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${ZHIHENG_REDIS_PASSWORD}\" redis-cli ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  zhiheng-network:
    name: zhiheng-network
    driver: bridge
  litellm-network:
    external: true
    name: litellm-network
