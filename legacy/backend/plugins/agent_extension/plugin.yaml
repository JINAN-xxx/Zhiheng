manifestVersion: 1
id: agent_extension
name: 智能体扩展
version: 0.4.0
description: 可配置智能体、平台共享技能与对外调用。

metadata:
  category: ai
  tags:
    - agent
    - skill
  author: insistence
  license: MIT

backend:
  module: plugins.agent_extension
  resourceReferences:
    ai.model: plugins.agent_extension.public.model_references:has_model_references
  hooks:
    onStartup: plugins.agent_extension.hooks:on_startup
    onShutdown: plugins.agent_extension.hooks:on_shutdown
  routers:
    autoScan: true
    publicPrefixes:
      - /v1/agents
  migrations:
    - migrations/mysql/001_skill_management.sql
    - migrations/postgresql/001_skill_management.sql
    - migrations/mysql/002_agent_management.sql
    - migrations/postgresql/002_agent_management.sql
    - migrations/mysql/003_agent_welcome_message.sql
    - migrations/postgresql/003_agent_welcome_message.sql
    - migrations/mysql/004_work_tasks.sql
    - migrations/postgresql/004_work_tasks.sql

frontend:
  basePath: extensions
  pluginId: agent_extension
  viewsPath: views
  apiPath: api
  delivery:
    type: source
    buildRequired: true
  menus:
    - name: 智能体扩展
      path: extensions
      component: Layout
      perms: ''
      type: M
      orderNum: 5
      icon: skill
      children:
        - name: 智能体管理
          path: agent
          component: plugin/agent_extension/agent/index
          routeName: AgentExtensionAgent
          perms: agent_extension:agent:list
          type: C
          orderNum: 1
          icon: ai-chat
        - name: 技能管理
          path: skill
          component: plugin/agent_extension/skill/index
          routeName: AgentExtensionSkill
          perms: agent_extension:skill:list
          type: C
          orderNum: 2
          icon: skill

permissions:
  - code: agent_extension:agent:use
    name: 使用已发布智能体
  - code: agent_extension:work:list
    name: 工作任务列表
  - code: agent_extension:work:query
    name: 查询工作任务
  - code: agent_extension:work:add
    name: 新建工作任务
  - code: agent_extension:work:edit
    name: 编辑工作任务
  - code: agent_extension:work:remove
    name: 删除工作任务
  - code: agent_extension:work:run
    name: 执行工作任务
  - code: agent_extension:agent:list
    name: 智能体列表
  - code: agent_extension:agent:query
    name: 查询智能体
  - code: agent_extension:agent:add
    name: 新增智能体
  - code: agent_extension:agent:edit
    name: 修改智能体
  - code: agent_extension:agent:remove
    name: 删除智能体
  - code: agent_extension:agent:publish
    name: 发布和停用智能体
  - code: agent_extension:agent:test
    name: 智能体试聊
  - code: agent_extension:skill:list
    name: 技能列表
  - code: agent_extension:skill:query
    name: 查询技能
  - code: agent_extension:skill:add
    name: 上传技能
  - code: agent_extension:skill:edit
    name: 修改技能状态
  - code: agent_extension:skill:remove
    name: 删除技能
  - code: agent_extension:skill:use
    name: 使用技能

dependencies:
  python: []
  npm: []
  npmDev: []
  plugins:
    - id: ai
      version: '>=0.9.0'
      description: 智能体复用模型调用、知识库和开发接入服务

compatibility:
  databases:
    - mysql
    - postgresql
