server {
    listen 80 default_server;
    server_name _;
    absolute_redirect off;
    # Allow the backend's 100 MiB files plus multipart framing.
    client_max_body_size 101m;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # Keep the public host/port and stream API responses without buffering.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Always revalidate the HTML shell so deployments can switch hashed assets safely.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location ^~ /static/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /monacoeditorwork/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Browser APIs and existing API clients retain their established prefix.
    location ^~ /docker-api/ {
        proxy_pass http://ruoyi-backend-pg:9099/;
    }

    # OpenAI-compatible and agent APIs keep /v1 when forwarded upstream.
    location = /v1 {
        proxy_pass http://ruoyi-backend-pg:9099;
    }
    location ^~ /v1/ {
        proxy_pass http://ruoyi-backend-pg:9099;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
